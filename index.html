<form id="studentForm">

<select id="className" required>
<option value="">Select Class</option>
<option>5</option><option>6</option><option>7</option><option>8</option>

</form>
<footer>
Test designed by: Syed Nadimuddin Kalimuddin Jafri<br>
<strong>Z.P.P. Urdu School, Nitrud</strong>
</footer>
</section>

<section id="quiz" class="card hidden">
<div class="urdu" id="progress">سوال 1 از 50</div>
<div class="bar"><div id="fill"></div></div>
<div id="question" class="urdu question"></div>
<div id="options" class="urdu"></div>
<div id="feedback" class="urdu hidden" aria-live="polite"></div>
<div class="row"><button id="next" class="primary hidden">اگلا سوال →</button></div>
</section>

<section id="result" class="card hidden">
<h2 class="urdu">🎉 ٹیسٹ مکمل ہوگیا!</h2>
<div id="studentSummary" class="summary"></div>
<h1 id="score"></h1>
<h2 id="percentage"></h2>
<div id="counts" class="urdu"></div>
<p id="saveStatus" class="urdu"></p>
<div class="row">
<button id="reviewBtn" class="secondary">📖 Review Answers</button>
<button id="mistakesBtn" class="secondary">💡 Learn from Mistakes</button>
<button id="retakeBtn" class="primary">🔄 دوبارہ ٹیسٹ دیں</button>
</div>
</section>

<section id="review" class="card hidden">
<h2 class="urdu">جوابات کا جائزہ</h2>
<div id="reviewList"></div>
<div class="row">
<button id="backBtn" class="secondary">نتیجے پر واپس جائیں</button>
<button id="reviewRetake" class="primary">دوبارہ ٹیسٹ دیں</button>
</div>
</section>
</main>

let studentInfo={},answers=[],order=[],pos=0,attempt=1,submitted=false,lastResult=null;
const $=id=>document.getElementById(id);
function show(id){["home","quiz","result","review"].forEach(x=>$(x).classList.toggle("hidden",x!==id));window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("studentForm").addEventListener("submit",e=>{e.preventDefault();studentInfo={student:$("student").value.trim(),className:$("className").value,school:$("school").value.trim(),taluka:$("taluka").value.trim()};attempt=1;start()});
function start(){answers=Array(50).fill(null);order=shuffle(Q.map((_,i)=>i));pos=0;submitted=false;lastResult=null;show("quiz");render()}
function render(){let qi=order[pos],q=Q[qi];$("progress").textContent=`سوال ${pos+1} از 50`;$("fill").style.width=`${pos/50*100}%`;$("question").textContent=q[0];$("feedback").classList.add("hidden");$("next").classList.add("hidden");$("options").innerHTML="";let opts=shuffle(q[1].map((t,i)=>({t,i})));opts.forEach((o,k)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<b>${String.fromCharCode(65+k)}.</b> ${esc(o.t)}`;b.onclick=()=>answer(o.i,b,opts);$("options").appendChild(b)})}
function answer(selected,button,opts){let qi=order[pos];if(answers[qi]!==null)return;answers[qi]=selected;[...$("options").children].forEach((b,k)=>{b.disabled=true;if(opts[k].i===Q[qi][2])b.classList.add("correct");if(opts[k].i===selected&&selected!==Q[qi][2])b.classList.add("wrong")});let good=selected===Q[qi][2];$("feedback").innerHTML=`<strong>${good?"درست جواب ✓":"غلط جواب ✗"}</strong><br>${good?"":"صحیح جواب: "+esc(Q[qi][1][Q[qi][2]])+"<br>"}${esc(Q[qi][3])}`;$("feedback").classList.remove("hidden");$("next").textContent=pos===49?"نتیجہ دیکھیں →":"اگلا سوال →";$("next").classList.remove("hidden")}
$("next").onclick=()=>{if(answers[order[pos]]===null)return;if(pos<49){pos++;render()}else finish()};
function finish(){let correct=answers.filter((a,i)=>a===Q[i][2]).length;let incorrect=answers.filter((a,i)=>a!==null&&a!==Q[i][2]).length;let unattempted=answers.filter(a=>a===null).length;lastResult={studentName:studentInfo.student,class:studentInfo.className,schoolName:studentInfo.school,taluka:studentInfo.taluka,attemptNumber:attempt,score:correct,percentage:correct*2,correct,incorrect,unattempted,testVersion:"1.0"};$("studentSummary").innerHTML=`Student: ${esc(studentInfo.student)}<br>Class: ${esc(studentInfo.className)}<br>School: ${esc(studentInfo.school)}<br>Taluka: ${esc(studentInfo.taluka)}<br>Attempt: ${attempt}`;$("score").textContent=`${correct} / 50`; $("percentage").textContent=`${correct*2}%`;$("counts").innerHTML=`صحیح جوابات: ${correct}<br>غلط جوابات: ${incorrect}<br>غیر حل شدہ سوالات: ${unattempted}`;show("result");saveResult()}
async function saveResult(){let s=$("saveStatus");if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL.includes("PASTE_YOUR")){s.textContent="Google Sheets ابھی منسلک نہیں ہے۔ نتیجہ اسکرین پر دکھایا گیا ہے لیکن محفوظ نہیں ہوا۔";return}if(submitted)return;submitted=true;s.textContent="نتیجہ محفوظ کیا جا رہا ہے…";try{let r=await fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(lastResult)});let d=await r.json();if(!d.success)throw Error(d.message||"Save failed");s.textContent="نتیجہ Google Sheets میں محفوظ ہوگیا۔"}catch(e){submitted=false;s.innerHTML=`نتیجہ محفوظ نہیں ہوسکا۔ دوبارہ کوشش کریں۔ <button id="retry">Retry</button>`;$("retry").onclick=saveResult}}
function review(mistakes){$("reviewList").innerHTML="";order.forEach((qi,n)=>{let q=Q[qi],a=answers[qi],ok=a===q[2];if(mistakes&&ok)return;let d=document.createElement("div");d.className="item urdu";d.innerHTML=`<b>سوال ${n+1}: ${esc(q[0])}</b><p>${a===null?"جواب نہیں دیا": "آپ کا جواب: "+esc(q[1][a])}</p><p>صحیح جواب: ${esc(q[1][q[2]])}</p><p>${esc(q[3])}</p><strong>${a===null?"غیر حل شدہ":ok?"درست جواب":"غلط جواب"}</strong>`;$("reviewList").appendChild(d)});show("review")}
$("reviewBtn").onclick=()=>review(false);$("mistakesBtn").onclick=()=>review(true);$("backBtn").onclick=()=>show("result");
function retake(){attempt++;start()}
$("retakeBtn").onclick=retake;$("reviewRetake").onclick=retake;
</script>
